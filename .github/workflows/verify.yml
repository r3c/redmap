name: Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '20 4 * * *'

jobs:
  lint:
    name: Run PHP linter validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: firehed/lint-php-action@v1

  test:
    name: Test with PHP ${{ matrix.version.php }}, MySQL ${{ matrix.version.mysql }}, client ${{ matrix.client }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        client:
          - mysql
        version:
          - mysql: "8.0"
            php: "8.1"
          - mysql: "8.0"
            php: "8.3"
          - mysql: "8.0"
            php: "8.5"

    services:
      mysql:
        image: mysql:${{ matrix.version.mysql }}
        ports:
          - "3306:3306"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: redmap
          MYSQL_ROOT_PASSWORD: ""

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.version.php }}
        uses: shivammathur/setup-php@v2
        with:
          extensions: mysql
          ini-values: zend.assertions=1
          php-version: ${{ matrix.version.php }}
      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping --host=127.0.0.1 --password=$MYSQL_ROOT_PASSWORD --silent; do
            sleep 1
          done
      - name: Run test suite
        run: php -d zend.assertions=1 test/index.php client=${{ matrix.client }}

  validate:
    name: Validate
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - run: true
